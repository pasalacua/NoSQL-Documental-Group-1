
{% extends "base.html" %}

{% block title %}POKÉLAB - Laboratorio{% endblock %}

{% block content %}

<div class="game-container">

    <section class="laboratory">

        <!-- Acceso al cuaderno -->
        <button id="notebook-button" class="notebook-button">
            <img
                src="{{ url_for('static', filename='assets/interface/CarpetaBDPKM.png') }}"
                alt="Abrir cuaderno de investigación"
            >
        </button>

        <!-- Personaje provisional -->
        <div class="oak-placeholder">
            <div class="placeholder-sprite">👨‍🔬</div>
            <span>PROF. OAK</span>
        </div>

        <!-- Cuadro de diálogo -->
        <div class="dialogue-box">
            <p id="dialogue-text">
                ¡Bienvenido al laboratorio Pokémon!
            </p>

            <button id="next-dialogue" class="dialogue-next">
                SIGUIENTE ▼
            </button>
        </div>

        <!-- Cuaderno de investigación -->
        <aside id="notebook-panel" class="notebook-overlay hidden">

            <button id="close-notebook" class="notebook-close">
                X
            </button>

            <div class="notebook-container">

                <img
                    src="{{ url_for('static', filename='assets/interface/Carpeta-abiertaBDPKN.png') }}"
                    alt="Cuaderno de investigación abierto"
                    class="notebook-image"
                >

                <div id="notebook-left" class="notebook-page notebook-left">
                </div>

                <div id="notebook-right" class="notebook-page notebook-right">
                </div>

                <div class="notebook-navigation">
                    <button id="previous-page" class="page-arrow" disabled>
                        ◀
                    </button>

                    <span id="page-indicator">1 / 3</span>

                    <button id="next-page" class="page-arrow">
                        ▶
                    </button>
                </div>

            </div>
        </aside>

    </section>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/dialogue.js') }}"></script>
<script src="{{ url_for('static', filename='js/notebook.js') }}"></script>
{% endblock %}
