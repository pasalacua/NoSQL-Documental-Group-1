
{% extends "base.html" %}

{% block title %}POKÉLAB - Laboratorio{% endblock %}

{% block content %}

<div class="game-container">

    <!-- Selector de nombre inspirado en la pantalla de entrada de Pokémon -->
    <section id="name-selector" class="name-selector-screen" aria-labelledby="name-selector-title">

        <div class="name-selector-panel">
            <div class="name-selector-prompt">
                <p id="name-selector-title">¿CUÁL ES TU NOMBRE?</p>
                <div class="name-display" aria-live="polite">
                    <span id="name-display-text">NUNEZ</span><span class="name-caret">▼</span>
                </div>
            </div>

            <div class="name-entry-layout">
                <div id="name-keyboard" class="name-keyboard" aria-label="Selector de letras"></div>

                <div class="name-actions">
                    <button id="name-backspace" class="name-action" type="button">◀ BORRAR</button>
                    <button id="name-confirm" class="name-action primary" type="button">OK ▶</button>
                </div>
            </div>

            <p class="name-selector-help">Seleccioná las letras y confirmá tu nombre, investigador.</p>
        </div>

    </section>

    <section id="laboratory" class="laboratory hidden" aria-live="polite">

        <!-- Acceso al cuaderno -->
        <button id="notebook-button" class="notebook-button">
            <img
                src="{{ url_for('static', filename='assets/interface/CarpetaBDPKM.png') }}"
                alt="Abrir cuaderno de investigación"
            >
        </button>

        <!-- Profesor Oak -->
        <div class="oak-character">
            <img
                src="{{ url_for('static', filename='assets/characters/trainers/professor-oak.png') }}"
                alt="Profesor Oak"
            >
        </div>

        <!-- Jugador -->
        <div class="player-character" id="player-character">
            <img
                src="{{ url_for('static', filename='assets/characters/trainers/Player-idle.png') }}"
                alt="Investigador"
            >
        </div>

        <!-- Entrenadores que visitan el laboratorio -->
        <div id="trainer-list" class="trainer-list hidden">

            <h2>ENTRENADORES</h2>

            <button class="trainer-option"
                    data-trainer="Entrenador Rojo"
                    data-request="Necesito encontrar un Pokémon que conozca el movimiento Follow Me y tenga más de 60 puntos de velocidad">
                <span class="trainer-sprite">🧢</span>
                <span>ENTRENADOR ROJO</span>
            </button>

            <button class="trainer-option"
                    data-trainer="Entrenadora Azul"
                    data-request="Estoy buscando un Pokémon de tipo Agua con una habilidad determinada">
                <span class="trainer-sprite">👩</span>
                <span>ENTRENADORA AZUL</span>
            </button>

            <button class="trainer-option"
                    data-trainer="Entrenador Verde"
                    data-request="Quiero investigar las formas alternativas de algunos Pokémon">
                <span class="trainer-sprite">🧑</span>
                <span>ENTRENADOR VERDE</span>
            </button>

        </div>

        <!-- Cuadro de diálogo -->
        <div class="dialogue-box">
            <p id="dialogue-text">
                ¡Bienvenido al laboratorio Pokémon!
            </p>

            <button id="next-dialogue" class="dialogue-next">
                SIGUIENTE ▼
            </button>
        </div>

        <!-- Cuaderno de investigación -->
        <aside id="notebook-panel" class="notebook-overlay hidden">

            <button id="close-notebook" class="notebook-close">
                X
            </button>

            <div class="notebook-container">

                <img
                    src="{{ url_for('static', filename='assets/interface/Carpeta-abiertaBDPKN.png') }}"
                    alt="Cuaderno de investigación abierto"
                    class="notebook-image"
                >

                <div id="notebook-left" class="notebook-page notebook-left">
                </div>

                <div id="notebook-right" class="notebook-page notebook-right">
                </div>

                <div class="notebook-navigation">
                    <button id="previous-page" class="page-arrow" disabled>
                        ◀
                    </button>

                    <span id="page-indicator">1 / 3</span>

                    <button id="next-page" class="page-arrow">
                        ▶
                    </button>
                </div>

            </div>
        </aside>

    </section>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/game.js') }}"></script>
<script src="{{ url_for('static', filename='js/dialogue.js') }}"></script>
<script src="{{ url_for('static', filename='js/notebook.js') }}"></script>
{% endblock %}
